<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR PRO AI — Заявка на подбор</title>
<link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script>document.documentElement.setAttribute('data-theme','dark');</script>
<style>
/* Публичная заявка на подбор — премиум-дизайн как у анкеты отклика / публичного результата */
html{color-scheme:dark}
html,body{height:auto!important;overflow:visible!important}
body{position:relative;background:linear-gradient(180deg,#0c0f22,#0a0c1a 52%,#0b0e20)!important;color:#eef1fb}
.rq-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(rgba(124,142,222,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(124,142,222,.05) 1px,transparent 1px);background-size:56px 56px}
.rq-glow{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(130px)}
.rq-glow.g1{top:-180px;left:50%;transform:translateX(-50%);width:1100px;height:560px;background:radial-gradient(closest-side,rgba(123,108,255,.20),transparent)}
.rq-glow.g2{top:820px;right:-240px;width:620px;height:620px;background:radial-gradient(closest-side,rgba(79,120,230,.13),transparent)}
/* фикс обрезанного окна: убираем flex-центровку с overflow — обычный поток и прокрутка страницы */
.take-shell{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:0 22px 70px;height:auto!important;min-height:100vh;display:block!important;overflow:visible!important;background:none!important;border:none!important;box-shadow:none!important}
.take-top{display:flex;align-items:center;gap:12px;padding:24px 0 6px;border:none!important;background:none!important}
/* логотип как на лендинге: иконка-молекула без подложки */
.take-top .brand-mark{width:44px;height:44px;background:none!important;box-shadow:none!important;border-radius:0;margin:0;cursor:default}
.take-top .brand-mark::after{display:none}
.take-top .brand-mark svg{width:44px;height:44px}
.take-top .brand-mark img{width:44px;height:44px;object-fit:cover;border-radius:12px}
.take-top #r-company{font-family:'Manrope',sans-serif;font-weight:800;font-size:15.5px;color:#fff;line-height:1.15}
.take-top .muted{color:#8b93ad!important}
.take-body{display:block!important;flex:none!important;height:auto!important;min-height:0!important;max-width:none;overflow:visible!important;padding:0!important;justify-content:flex-start!important}
/* герой */
.rq-hero{padding:30px 0 24px}
.rq-eyebrow{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#b3a4ff;margin-bottom:14px}
.rq-title{font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:-.02em;font-size:clamp(27px,4.6vw,40px);line-height:1.08;margin:0 0 14px;color:#fff}
.rq-intro{color:#b3bad0;font-size:14.5px;line-height:1.6;margin:0;max-width:600px}
/* секции формы — стеклянные панели */
.req-sec{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018))!important;border:1px solid rgba(139,108,255,.2)!important;border-radius:20px!important;padding:22px 24px!important;margin-bottom:16px!important;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.req-sec-h{color:#b3a4ff!important}
.lbl{color:#c3cbe4}
.req-hint{color:#8b93ad!important}
.field,input.field,select.field,textarea.field{background:rgba(255,255,255,.04)!important;border-color:rgba(255,255,255,.13)!important;color:#eef1fb!important}
.field:focus{border-color:rgba(139,108,255,.7)!important;box-shadow:0 0 0 3px rgba(123,108,255,.15)!important}
/* таблица качеств */
.form-grid>div{min-width:0}
.trait-table{table-layout:fixed;background:rgba(255,255,255,.02)!important;border-color:rgba(255,255,255,.1)!important;border-radius:14px}
.trait-check{width:36px}
.trait-name{width:168px;white-space:normal}
.trait-table td{border-color:rgba(255,255,255,.07)!important}
.trait-row:hover{background:rgba(139,108,255,.07)!important}
.trait-row.on{background:rgba(139,108,255,.15)!important}
.trait-name{font-weight:700;color:#eef1fb}
.trait-desc{color:#9aa3bf;line-height:1.5}
.tr-rec{background:rgba(139,108,255,.1)!important;border-color:rgba(139,108,255,.3)!important}
.tr-rec-txt{color:#c3cbe4!important}
.pos-hint{color:#b3a4ff!important}
/* переключатель уровня */
.seg-toggle{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.12)}
.seg-opt{color:#9aa3bf}
.seg-opt.on{background:rgba(139,108,255,.22);color:#e6defd;box-shadow:none}
/* кнопка отправки */
.rq-submit{display:block;width:100%;box-sizing:border-box;margin-top:6px;border:none;background:linear-gradient(135deg,#7b5cff,#4f78e6);color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:16px;padding:16px;border-radius:14px;box-shadow:0 12px 30px rgba(123,108,255,.4);cursor:pointer;transition:transform .16s}
.rq-submit:active{transform:scale(.985)}
.rq-submit:disabled{opacity:.6;cursor:default}
/* финальные экраны (отправлено / утверждено / не найдено) */
.rq-done{max-width:520px;margin:80px auto 0;text-align:center}
.rq-done .mk{width:96px;height:96px;margin:0 auto;border-radius:28px;display:grid;place-items:center;background:linear-gradient(135deg,#43e0a0,#2f9e6b);box-shadow:0 20px 50px rgba(67,224,160,.4)}
.rq-done .mk.pop{animation:rq-pop .5s cubic-bezier(.2,.8,.3,1)}
.rq-done .mk svg{width:48px;height:48px;color:#fff}
.rq-done h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;color:#fff;margin:26px 0 0}
.rq-done p{font-size:15px;line-height:1.6;color:#9aa3bf;margin:12px 0 0}
@keyframes rq-pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
/* ИИ-проверка формулировки продукта */
.rq-prod-box{margin-top:10px;padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.55;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#c3cbe4}
.rq-prod-box p{margin:6px 0 0}
.rq-prod-box.good{border-color:rgba(67,224,160,.4);background:rgba(67,224,160,.08);color:#bdf0d9}
.rq-prod-box.low{border-color:rgba(255,122,92,.4);background:rgba(255,122,92,.08);color:#ffd2c6}
.rq-prod-box.mid{color:#b3a4ff}
@media(max-width:640px){.take-shell{padding:0 16px 50px}.req-sec{padding:18px 16px!important}.trait-name{width:110px}}
</style>
</head><body>
<div class="rq-grid"></div><div class="rq-glow g1"></div><div class="rq-glow g2"></div>
<div class="take-shell" id="shell">
  <div class="take-top">
    <span class="brand-mark" id="brand"><svg viewBox="0 0 64 64" fill="none"><path d="M32 4 56 18 56 46 32 60 8 46 8 18Z" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" opacity=".9"/><line x1="33" y1="31" x2="22" y2="25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="33" y1="31" x2="41" y2="21" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="33" y1="31" x2="46" y2="35" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="33" y1="31" x2="29" y2="45" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="22" cy="25" r="3.4" stroke="#fff" stroke-width="2"/><circle cx="41" cy="21" r="3.6" stroke="#fff" stroke-width="2"/><circle cx="46" cy="35" r="3.2" stroke="#fff" stroke-width="2"/><circle cx="29" cy="45" r="3" stroke="#fff" stroke-width="2"/><circle cx="33" cy="31" r="4.2" fill="#FF7A5C"/></svg></span>
    <div><div id="r-company">HR PRO AI</div><div class="muted" style="font-size:12px;max-width:170px;line-height:1.25" id="r-sub">Технология, которая чувствует людей</div></div>
  </div>
  <div class="take-body" id="root"><p class="muted">Загрузка…</p></div>
</div>
<div class="toast" id="toast"></div>
<script src="/js/req-schema.js"></script>
<script src="/js/position-ref.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);};
const T={
  ru:{slogan:'Технология, которая чувствует людей',sub:'Заявка на подбор персонала',intro:'Заполните форму подбора — на её основе HR создаст вакансию и объявление.',lang:'Язык вакансии',submit:'Отправить заявку в HR',sent:'Заявка отправлена в HR. Спасибо!',err:'Ошибка отправки',notfound:'Заявка не найдена',check:'Проверьте ссылку.',max:'Можно выбрать не более ',level:'Уровень должности',staff:'Рядовой сотрудник',lead:'Руководитель',recog:'Распознана должность',rec_for:'Для должности',rec_lead:'Для руководителя направления',rec_advise:'методика рекомендует обратить внимание на качества',apply:'Отметить в списке',locked:'Заявка утверждена',locked_hint:'Изменения в утверждённую заявку вносит HR-менеджер.',prod_what:'Что это?',prod_check:'Проверить формулировку',prod_checking:'ИИ проверяет формулировку…',prod_sugg:'Как можно сформулировать'},
  pl:{slogan:'Technologia, która czuje ludzi',sub:'Wniosek o dobór personelu',intro:'Wypełnij formularz doboru — na jego podstawie HR utworzy wakat i ogłoszenie.',lang:'Język wakatu',submit:'Wyślij wniosek do HR',sent:'Wniosek wysłany do HR. Dziękujemy!',err:'Błąd wysyłania',notfound:'Nie znaleziono wniosku',check:'Sprawdź link.',max:'Można wybrać maksymalnie ',level:'Poziom stanowiska',staff:'Szeregowy pracownik',lead:'Kierownik',recog:'Rozpoznane stanowisko',rec_for:'Dla stanowiska',rec_lead:'Dla kierownika działu',rec_advise:'metodyka zaleca zwrócić uwagę na cechy',apply:'Zaznacz na liście',locked:'Wniosek zatwierdzony',locked_hint:'Zmiany w zatwierdzonym wniosku wprowadza menedżer HR.',prod_what:'Co to jest?',prod_check:'Sprawdź sformułowanie',prod_checking:'AI sprawdza sformułowanie…',prod_sugg:'Jak można sformułować'},
  en:{slogan:'Technology that feels people',sub:'Personnel selection requisition',intro:'Fill in the selection form — HR will create the vacancy and job ad based on it.',lang:'Vacancy language',submit:'Send requisition to HR',sent:'Requisition sent to HR. Thank you!',err:'Sending error',notfound:'Requisition not found',check:'Check the link.',max:'You can select at most ',level:'Position level',staff:'Regular employee',lead:'Manager',recog:'Recognized position',rec_for:'For the position',rec_lead:'For a department head',rec_advise:'the methodology recommends focusing on the qualities',apply:'Select in the list',locked:'Requisition approved',locked_hint:'Changes to an approved requisition are made by the HR manager.',prod_what:'What is this?',prod_check:'Check the wording',prod_checking:'AI is checking the wording…',prod_sugg:'Suggested wording'},
};
let LG='ru'; const tl=k=>(T[LG]&&T[LG][k]!=null?T[LG][k]:T.ru[k]);
const parts=location.pathname.split('/').filter(Boolean);
const isNew=parts[0]==='new-req';           // универсальная ссылка компании
const code=parts[parts.length-1];
let R={form:{},lang:'ru'};
let CO='HR PRO AI';
// под брендом HR PRO AI — слоган как на лендинге; для компании со своим именем — назначение формы
function updSub(){$('#r-sub').textContent=(CO==='HR PRO AI')?tl('slogan'):tl('sub');}
async function load(){
  let meta;
  if(isNew){
    const r=await fetch('/api/company/'+encodeURIComponent(code)+'/meta');
    if(!r.ok)return notFound();
    meta=await r.json();
    R={form:{},lang:localStorage.getItem('hp_lang')||'ru'};
  }else{
    const r=await fetch('/api/req/'+encodeURIComponent(code));
    if(!r.ok)return notFound();
    R=await r.json().then(d=>d.requisition);
    meta={company:R.company,logo:R.logo};
  }
  LG=['ru','pl','en'].includes(R.lang)?R.lang:'ru';document.documentElement.lang=LG;
  if(meta.company){CO=meta.company;$('#r-company').textContent=meta.company;}
  if(meta.logo)$('#brand').innerHTML='<img src="'+esc(meta.logo)+'">';
  updSub();
  render();
}
function notFound(){$('#root').innerHTML='<div class="rq-done"><h1>'+tl('notfound')+'</h1><p>'+tl('check')+'</p></div>';}
function fieldHtml(f,val){
  const lab=reqLabel(f.label,LG);
  const desc=(f.desc||f.hint)?'<span class="req-hint">'+esc(reqLabel(f.desc||f.hint,LG))+'</span>':'';
  const id='rq-'+f.key;
  if(f.type==='textarea'){
    // «Ожидаемый продукт»: «Что это?» → гайд методики; «Проверить формулировку» → ИИ-проверка с подсказкой
    const extra=f.key==='product'?'<div class="rq-prod-tools" style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">'
      +'<button type="button" class="btn ghost xs" id="rq-prod-what">'+tl('prod_what')+'</button>'
      +'<button type="button" class="btn soft xs" id="rq-prod-check">'+AIIC+' '+tl('prod_check')+'</button></div><div id="rq-prod-res"></div>':'';
    return '<div class="full"><label class="lbl">'+esc(lab)+(f.req?' *':'')+'</label>'+desc+'<textarea class="field" id="'+id+'" rows="2">'+esc(val||'')+'</textarea>'+extra+'</div>';
  }
  if(f.type==='number')return '<div><label class="lbl">'+esc(lab)+'</label>'+desc+'<input class="field" id="'+id+'" type="number" value="'+esc(val||'')+'"></div>';
  if(f.type==='select'){const opts=f.options.map(o=>'<option value="'+o.value+'" '+(val===o.value?'selected':'')+'>'+esc(reqLabel(o.label,LG))+'</option>').join('');
    return '<div><label class="lbl">'+esc(lab)+'</label>'+desc+'<select class="field" id="'+id+'"><option value="">—</option>'+opts+'</select></div>';}
  if(f.type==='traits'){const cur=Array.isArray(val)?val:(typeof val==='string'&&val?val.split(','):[]);
    const rows=REQ_SCHEMA.traits.map(tr=>'<tr class="trait-row '+(cur.includes(tr.key)?'on':'')+'"><td class="trait-check"><input type="checkbox" value="'+tr.key+'" '+(cur.includes(tr.key)?'checked':'')+' data-trait></td><td class="trait-name">'+esc(reqLabel(tr.l,LG))+'</td><td class="trait-desc">'+esc(reqLabel(tr.d,LG))+'</td></tr>').join('');
    return '<div class="full"><label class="lbl">'+esc(lab)+'</label>'+desc+'<div class="traits-rec" id="traits-rec"></div><table class="trait-table" id="'+id+'" data-max="'+(f.max||3)+'"><tbody>'+rows+'</tbody></table></div>';}
  if(f.key==='position')
    return '<div class="full"><label class="lbl">'+esc(lab)+(f.req?' *':'')+'</label>'+desc+'<input class="field" id="'+id+'" value="'+esc(val||'')+'"><div class="pos-hint" id="pos-hint"></div></div>';
  return '<div class="full"><label class="lbl">'+esc(lab)+(f.req?' *':'')+'</label>'+desc+'<input class="field" id="'+id+'" value="'+esc(val||'')+'"></div>';
}
const AIIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" style="width:14px;height:14px;vertical-align:-2px"><path d="M12 3l1.8 4.9L18.7 9.7 13.8 11.5 12 16.4l-1.8-4.9L5.3 9.7l4.9-1.8L12 3Z"/></svg>';
function analyzePos(){
  const posEl=$('#rq-position');if(!posEl)return;
  const hint=$('#pos-hint'),rec=$('#traits-rec'),seg=$('#rq-level');
  const level=seg?seg.dataset.level:'staff';
  const pos=matchPosition(posEl.value);
  if(hint)hint.innerHTML=pos?AIIC+' '+tl('recog')+': <b>«'+esc(reqLabel(pos.name,LG))+'»</b>':'';
  if(!rec)return;
  if(level!=='lead'&&!pos){rec.innerHTML='';return;}
  const quals=recommendedQualities(pos,level,LG);
  if(!quals.length){rec.innerHTML='';return;}
  const keys=[...new Set(quals.map(q=>q.trait).filter(Boolean))];
  const forWhom=level==='lead'?'<b>'+esc(tl('rec_lead'))+'</b>':tl('rec_for')+' <b>«'+esc(reqLabel(pos.name,LG))+'»</b>';
  const points=level==='lead'?POSITION_REF[0].points:(pos?pos.points:'');
  rec.innerHTML='<div class="tr-rec"><div class="tr-rec-txt">'+AIIC+' '+forWhom+' '+tl('rec_advise')+': <b>'+quals.map(q=>esc(q.label)).join(', ')+'</b>'+(points?' <span class="muted">('+points+')</span>':'')+'</div>'+(keys.length?'<button type="button" class="btn ghost xs" id="traits-apply">'+tl('apply')+'</button>':'')+'</div>';
  const ap=$('#traits-apply');if(ap)ap.onclick=()=>{const tw=$('#rq-traits');if(!tw)return;const pick=keys.slice(0,+tw.dataset.max||3);$$('[data-trait]',tw).forEach(c=>{c.checked=pick.includes(c.value);});$$('.trait-row',tw).forEach(r=>r.classList.toggle('on',r.querySelector('input').checked));};
}
function render(){
  // Утверждённая заявка закрыта для руководителя — менять может только HR в портале
  if(R.status==='approved'){
    $('#root').innerHTML='<div class="rq-done">'
      +'<div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg></div>'
      +'<h1>'+tl('locked')+'</h1><p>'+tl('locked_hint')+'</p></div>';
    return;
  }
  const form=R.form||{};
  const secs=REQ_SCHEMA.sections.map(sec=>{
    const fs=REQ_SCHEMA.fields.filter(f=>f.section===sec.key);
    return '<div class="req-sec"><div class="req-sec-h">'+esc(reqLabel(sec.title,LG))+'</div><div class="form-grid">'+fs.map(f=>fieldHtml(f,form[f.key])).join('')+'</div></div>';
  }).join('');
  const lv=(R.form&&R.form.level==='lead')?'lead':'staff';
  const langCell=isNew?'<div><label class="lbl">'+tl('lang')+'</label><select class="field" id="rq-lang" style="max-width:240px"><option value="ru" '+(LG==='ru'?'selected':'')+'>Русский</option><option value="pl" '+(LG==='pl'?'selected':'')+'>Polski</option><option value="en" '+(LG==='en'?'selected':'')+'>English</option></select></div>':'';
  const topSec='<div class="req-sec"><div class="form-grid">'+langCell
    +'<div><label class="lbl">'+tl('level')+'</label><div class="seg-toggle" id="rq-level" data-level="'+lv+'">'
    +'<button type="button" class="seg-opt '+(lv!=='lead'?'on':'')+'" data-lvl="staff">'+tl('staff')+'</button>'
    +'<button type="button" class="seg-opt '+(lv==='lead'?'on':'')+'" data-lvl="lead">'+tl('lead')+'</button></div></div>'
    +'</div></div>';
  const hero='<div class="rq-hero"><div class="rq-eyebrow">'+esc(CO)+'</div>'
    +'<h1 class="rq-title">'+tl('sub')+'</h1>'
    +'<p class="rq-intro">'+tl('intro')+'</p></div>';
  $('#root').innerHTML=hero+topSec+secs
    +'<button class="rq-submit" id="submit">'+tl('submit')+'</button>';
  const tw=$('#rq-traits');
  if(tw)tw.addEventListener('change',e=>{const max=+tw.dataset.max||3;const checked=$$('[data-trait]:checked',tw);
    if(checked.length>max){e.target.checked=false;toast(tl('max')+max);}
    $$('.trait-row',tw).forEach(r=>r.classList.toggle('on',r.querySelector('input').checked));});
  const ls=$('#rq-lang');if(ls)ls.onchange=()=>{LG=ls.value;R.lang=ls.value;document.documentElement.lang=LG;updSub();render();};
  const posEl=$('#rq-position');if(posEl){let td;posEl.addEventListener('input',()=>{clearTimeout(td);td=setTimeout(analyzePos,350);});}
  const seg=$('#rq-level');if(seg)$$('[data-lvl]',seg).forEach(b=>b.onclick=()=>{seg.dataset.level=b.dataset.lvl;$$('[data-lvl]',seg).forEach(x=>x.classList.toggle('on',x===b));analyzePos();});
  analyzePos();
  $('#submit').onclick=submit;
  // Кнопки поля «Ожидаемый продукт»: гайд + ИИ-проверка формулировки (с подсказкой готового варианта)
  const pw=$('#rq-prod-what');if(pw)pw.onclick=()=>window.open('/storage/guide/hiring-by-data','_blank');
  const pc=$('#rq-prod-check');if(pc)pc.onclick=async()=>{
    const ta=$('#rq-product'),res=$('#rq-prod-res');if(!ta||!res)return;
    pc.disabled=true;
    res.innerHTML='<div class="rq-prod-box mid">'+AIIC+' '+tl('prod_checking')+'</div>';
    try{
      const pos=($('#rq-position')||{}).value||'';
      const r=await fetch('/api/req-product-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer:ta.value,position:pos,lang:LG})});
      const d=await r.json();
      if(!r.ok||d.error)throw new Error(d.error||'err');
      res.innerHTML='<div class="rq-prod-box '+(d.ok?'good':'low')+'"><b>'+AIIC+' '+esc(d.verdict||'')+'</b>'
        +(d.hint?'<p>'+esc(d.hint)+'</p>':'')
        +(d.suggestion?'<p><b>'+tl('prod_sugg')+':</b> '+esc(d.suggestion)+'</p>':'')+'</div>';
    }catch(e){res.innerHTML='';toast(tl('err'));}
    pc.disabled=false;
  };
}
function collect(){
  const form={};
  REQ_SCHEMA.fields.forEach(f=>{
    if(f.type==='traits'){const w=$('#rq-'+f.key);form[f.key]=w?$$('[data-trait]:checked',w).map(c=>c.value):[];}
    else{const el=$('#rq-'+f.key);form[f.key]=el?el.value:'';}
  });
  const seg=$('#rq-level');form.level=seg?seg.dataset.level:'staff';
  return form;
}
async function submit(){
  const b=$('#submit');b.disabled=true;
  try{
    const url=isNew?'/api/company/'+encodeURIComponent(code)+'/requisition':'/api/req/'+encodeURIComponent(code);
    const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({form:collect(),lang:R.lang||LG})});
    if(!resp.ok)throw new Error('send');
    window.scrollTo(0,0);
    $('#root').innerHTML='<div class="rq-done">'
      +'<div class="mk pop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg></div>'
      +'<h1>'+tl('sent')+'</h1></div>';
  }catch(e){toast(tl('err'));b.disabled=false;}
}
load();
</script>
</body></html>
