<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR PRO AI</title>
<link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head><body>
<style>
/* Анкета отклика — премиум-дизайн claude.ai/design «Vacancy Apply» */
body{position:relative;background:linear-gradient(180deg,#0c0f22,#0a0c1a 52%,#0b0e20)!important;color:#eef1fb}
.aq-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(rgba(124,142,222,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(124,142,222,.05) 1px,transparent 1px);background-size:56px 56px}
.aq-glow{position:fixed;top:-160px;left:50%;transform:translateX(-50%);width:1200px;height:640px;border-radius:50%;filter:blur(130px);background:radial-gradient(ellipse at center,rgba(103,90,224,.24),transparent 66%);z-index:0;pointer-events:none}
.aq-glow2{position:fixed;top:820px;right:-220px;width:600px;height:600px;border-radius:50%;filter:blur(130px);background:radial-gradient(circle at center,rgba(111,151,255,.08),transparent 64%);z-index:0;pointer-events:none}
.take-top{display:none!important}
html,body{height:auto!important;overflow:visible!important}
.take-shell{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 34px 70px;background:none!important;border:none!important;box-shadow:none!important;height:auto!important;min-height:100vh;display:block!important;overflow:visible!important}
.take-body{max-width:none;padding:0!important;flex:none!important;overflow:visible!important;display:block!important;justify-content:flex-start!important;height:auto!important;min-height:0!important}
.aq-brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0 8px}
.aq-brand .lg{width:42px;height:42px;flex:none;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#6f6ae0,#4f78e6);display:grid;place-items:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:16px;color:#fff;box-shadow:0 8px 22px rgba(79,120,230,.35)}
.aq-brand .lg img{width:100%;height:100%;object-fit:cover}
.aq-brand .co{font-family:'Manrope',sans-serif;font-weight:800;font-size:15.5px;color:#fff;line-height:1.15}
.aq-brand .cs{font-size:11.5px;color:#8b93ad}
.aq-cols{display:grid;grid-template-columns:1fr 420px;gap:28px;align-items:start;margin-top:22px}
.aq-eyebrow{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#b3a4ff;margin-bottom:14px}
.aq-title{font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:-.02em;font-size:38px;line-height:1.08;margin:0 0 22px;color:#fff}
.aq-desc{color:#b3bad0;font-size:14.5px;line-height:1.6}
.aq-desc h2,.aq-desc h3,.aq-desc h4{font-family:'Manrope',sans-serif;font-weight:800;font-size:17px;color:#eef1fb;margin:24px 0 12px;display:flex;align-items:center;gap:9px}
.aq-desc h2::before,.aq-desc h3::before,.aq-desc h4::before{content:"";width:6px;height:18px;border-radius:3px;background:linear-gradient(180deg,#8b6cff,#6f97ff);flex:none}
.aq-desc h2:first-child,.aq-desc h3:first-child,.aq-desc h4:first-child{margin-top:0}
.aq-desc p{margin:0 0 12px}
.aq-desc ul,.aq-desc ol{margin:0 0 14px;padding-left:0;list-style:none}
.aq-desc li{margin:9px 0;padding-left:20px;position:relative}
.aq-desc li::before{content:"›";position:absolute;left:0;color:#8b6cff;font-weight:800}
.aq-desc b,.aq-desc strong{color:#eef1fb}
.aq-form{position:sticky;top:22px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border:1px solid rgba(139,108,255,.22);border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.4),0 0 60px rgba(123,108,255,.1)}
.aq-status{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.aq-dot{width:8px;height:8px;flex:none;border-radius:50%;background:#43e0a0;box-shadow:0 0 10px #43e0a0;animation:aq-pulse 2.4s ease-in-out infinite}
@keyframes aq-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes aq-pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.aq-status b{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8b93ad;font-weight:700}
.aq-form h2{font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;color:#fff;margin:0 0 4px}
.aq-lead{font-size:13px;line-height:1.5;color:#9aa3bf;margin:0 0 18px}
.aq-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.aq-lbl{display:block;font-size:11.5px;font-weight:600;color:#c3cbe4;margin-bottom:6px}
.vfield{width:100%;box-sizing:border-box;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#eef1fb;font-family:Inter,sans-serif;font-size:14.5px;padding:12px 14px;outline:none;transition:border-color .18s,box-shadow .18s;margin-bottom:12px}
.vfield::placeholder{color:#5f6885}
.vfield:focus{border-color:rgba(139,108,255,.7);box-shadow:0 0 0 3px rgba(123,108,255,.15)}
.aq-cvup{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:13px;border:1.5px dashed rgba(139,108,255,.4);background:rgba(139,108,255,.06);cursor:pointer;margin-top:6px}
.aq-cvup.has{border-color:rgba(67,224,160,.4);background:rgba(67,224,160,.06)}
.aq-cvup .cvic{width:38px;height:38px;flex:none;border-radius:11px;background:rgba(139,108,255,.16);display:grid;place-items:center}
.aq-cvup .cvtx{min-width:0}
.aq-cvup .cvtx b{display:block;font-family:'Manrope',sans-serif;font-weight:700;font-size:13.5px;color:#eef1fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.aq-cvup .cvtx span{display:block;font-size:11.5px;color:#8b93ad;margin-top:2px}
.aq-apply{width:100%;box-sizing:border-box;margin-top:18px;border:none;background:linear-gradient(135deg,#7b5cff,#4f78e6);color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:16px;padding:15px;border-radius:14px;box-shadow:0 12px 30px rgba(123,108,255,.4);cursor:pointer;transition:transform .16s}
.aq-apply:active{transform:scale(.985)}
.aq-privacy{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:11px;line-height:1.5;color:#6b7492}
.aq-privacy svg{flex:none}
.aq-done{max-width:520px;margin:70px auto;text-align:center}
.aq-done .mk{width:96px;height:96px;margin:0 auto;border-radius:28px;display:grid;place-items:center;background:linear-gradient(135deg,#43e0a0,#2f9e6b);box-shadow:0 20px 50px rgba(67,224,160,.4);animation:aq-pop .5s cubic-bezier(.2,.8,.3,1)}
.aq-done h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;color:#fff;margin:26px 0 0}
.aq-done p{font-size:15px;line-height:1.6;color:#9aa3bf;margin:12px 0 0}
@media(max-width:820px){.take-shell{padding:0 18px 50px}.aq-cols{grid-template-columns:1fr;gap:20px}.aq-form{position:static}.aq-title{font-size:29px}}
</style>
<div class="aq-grid"></div><div class="aq-glow"></div><div class="aq-glow2"></div>
<div class="take-shell" id="shell">
  <div class="take-top">
    <span class="brand-mark" id="brand" style="width:40px;height:40px;border-radius:12px"><svg viewBox="0 0 64 64" fill="none"><path d="M32 4 56 18 56 46 32 60 8 46 8 18Z" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" opacity=".9"/><circle cx="33" cy="31" r="4.2" fill="#FF7A5C"/></svg></span>
    <div><div style="font-weight:800" id="a-company">HR PRO AI</div><div class="muted" style="font-size:12.5px" id="a-sub">Отклик на вакансию</div></div>
  </div>
  <div class="take-body" id="root"><p class="muted">Загрузка…</p></div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);};
if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');
// локализация публичной анкеты — по языку вакансии
const AL={
  ru:{sub:'Отклик на вакансию',loading:'Загрузка…',not_found:'Анкета не найдена',check_link:'Проверьте ссылку.',fill:'Заполните форму, чтобы откликнуться на вакансию.',name:'Имя',surname:'Фамилия',phone:'Телефон',city:'Город',name_ph:'Ваше имя',surname_ph:'Ваша фамилия',city_ph:'Город',cv:'Резюме (CV)',attach:'Прикрепить файл',no_file:'Файл не выбран',apply:'Откликнуться',bad_email:'Укажите корректный email',bad_phone:'Укажите корректный телефон (9–15 цифр)',sending:'Отправка…',too_big:'Файл слишком большой (макс 12 МБ)',thanks:'Спасибо! Ваш отклик получен.',send_err:'Ошибка отправки',done:'Готово!',open_status:'Набор открыт',form_title:'Откликнуться',form_lead:'Заполните форму — после отклика откроется короткая вступительная анкета. Пара минут.',privacy:'Отправляя форму, вы соглашаетесь на обработку персональных данных.',vac_eyebrow:'Вакансия'},
  pl:{sub:'Zgłoszenie na wakat',loading:'Ładowanie…',not_found:'Nie znaleziono ankiety',check_link:'Sprawdź link.',fill:'Wypełnij formularz, aby zgłosić się na wakat.',name:'Imię',surname:'Nazwisko',phone:'Telefon',city:'Miasto',name_ph:'Twoje imię',surname_ph:'Twoje nazwisko',city_ph:'Miasto',cv:'CV',attach:'Załącz plik',no_file:'Nie wybrano pliku',apply:'Zgłoś się',bad_email:'Podaj poprawny e-mail',bad_phone:'Podaj poprawny telefon (9–15 cyfr)',sending:'Wysyłanie…',too_big:'Plik za duży (maks. 12 MB)',thanks:'Dziękujemy! Twoje zgłoszenie zostało odebrane.',send_err:'Błąd wysyłania',done:'Gotowe!',open_status:'Rekrutacja otwarta',form_title:'Zgłoś się',form_lead:'Wypełnij formularz — po zgłoszeniu otworzy się krótki test. Zajmie kilka minut.',privacy:'Wysyłając formularz, zgadzasz się na przetwarzanie danych osobowych.',vac_eyebrow:'Wakat'},
  en:{sub:'Job application',loading:'Loading…',not_found:'Form not found',check_link:'Check the link.',fill:'Fill in the form to apply for the vacancy.',name:'First name',surname:'Last name',phone:'Phone',city:'City',name_ph:'Your first name',surname_ph:'Your last name',city_ph:'City',cv:'Resume (CV)',attach:'Attach file',no_file:'No file selected',apply:'Apply',bad_email:'Enter a valid email',bad_phone:'Enter a valid phone (9–15 digits)',sending:'Sending…',too_big:'File too large (max 12 MB)',thanks:'Thank you! Your application has been received.',send_err:'Sending error',done:'Done!',open_status:'Hiring now',form_title:'Apply now',form_lead:'Fill in the form — a short test opens right after. It takes a couple of minutes.',privacy:'By submitting, you agree to the processing of your personal data.',vac_eyebrow:'Vacancy'},
};
let AG='ru';
const al=k=>(AL[AG]&&AL[AG][k]!=null?AL[AG][k]:AL.ru[k]);
const slug=decodeURIComponent(location.pathname.split('/').pop());
let A=null;
async function load(){
  const r=await fetch('/api/a/'+encodeURIComponent(slug));
  if(!r.ok){$('#root').innerHTML='<div class="card"><h2>'+al('not_found')+'</h2><p class="muted">'+al('check_link')+'</p></div>';return;}
  A=await r.json().then(d=>d.anketa);
  AG=['ru','pl','en'].includes(A.lang)?A.lang:'ru';document.documentElement.lang=AG;
  $('#a-sub').textContent=al('sub');
  if(A.company)$('#a-company').textContent=A.company;
  if(A.logo)$('#brand').innerHTML='<img src="'+esc(A.logo)+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px">';
  document.title=A.pageTitle||A.title||'HR PRO AI';
  // JSON-LD JobPosting для Google for Jobs (Googlebot исполняет JS и читает разметку)
  fetch('/api/a/'+encodeURIComponent(slug)+'/jsonld').then(r=>r.json()).then(ld=>{
    if(ld&&ld.title){const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(ld);document.head.appendChild(s);}
  }).catch(()=>{});
  renderForm();
}
function renderForm(){
  const eyebrow=(A.company?esc(A.company)+' · ':'')+al('vac_eyebrow');
  const co=(A.company||'HR PRO AI').trim();
  const inits=co.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'HR';
  const brand=`<div class="aq-brand"><div style="display:flex;align-items:center;gap:11px">
    <span class="lg">${A.logo?`<img src="${esc(A.logo)}">`:esc(inits)}</span>
    <div><div class="co">${esc(co)}</div><div class="cs">${al('sub')}</div></div></div></div>`;
  $('#root').innerHTML=brand+`<div class="aq-cols">
    <div>
      <div class="aq-eyebrow">${eyebrow}</div>
      <h1 class="aq-title">${esc(A.pageTitle||A.title)}</h1>
      ${A.description?`<div class="anketa-desc aq-desc">${A.description}</div>`:`<p style="color:#9aa3bf">${al('fill')}</p>`}
    </div>
    <div class="aq-form">
      <div class="aq-status"><span class="aq-dot"></span><b>${al('open_status')}</b></div>
      <h2>${esc(A.btnText&&A.btnText!==al('apply')?A.btnText:al('form_title'))}</h2>
      <p class="aq-lead">${al('form_lead')}</p>
      <div class="aq-2col">
        <div><label class="aq-lbl">${al('name')}</label><input class="vfield" id="f-name" placeholder="${al('name_ph')}"></div>
        <div><label class="aq-lbl">${al('surname')}</label><input class="vfield" id="f-surname" placeholder="${al('surname_ph')}"></div>
      </div>
      <label class="aq-lbl">Email <span style="color:#ff9d84">*</span></label><input class="vfield" id="f-email" type="email" placeholder="you@email.com">
      <div class="aq-2col">
        <div><label class="aq-lbl">${al('phone')}</label><input class="vfield" id="f-tel" placeholder="+…" inputmode="tel"></div>
        <div><label class="aq-lbl">${al('city')}</label><input class="vfield" id="f-city" placeholder="${al('city_ph')}"></div>
      </div>
      <label class="aq-lbl" style="margin-top:6px">${al('cv')}</label>
      <label class="aq-cvup" id="cv-drop">
        <input type="file" id="f-cv" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" hidden>
        <span class="cvic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#b3a4ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L10.6 17a1.6 1.6 0 0 1-2.3-2.3l7.5-7.5"/></svg></span>
        <span class="cvtx"><b id="cv-name">${al('attach')}</b><span id="cv-sub">${al('no_file')}</span></span>
      </label>
      <button class="aq-apply" id="apply">${esc(A.btnText||al('apply'))} →</button>
      <div class="aq-privacy"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#43e0a0" stroke-width="2"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Z" stroke-linejoin="round"/></svg>${al('privacy')}</div>
    </div>
  </div>`;
  $('#f-cv').onchange=()=>{const f=$('#f-cv').files[0];const drop=$('#cv-drop');if(f){$('#cv-name').textContent=f.name;$('#cv-sub').textContent='';drop.classList.add('has');}else{$('#cv-name').textContent=al('attach');$('#cv-sub').textContent=al('no_file');drop.classList.remove('has');}};
  $('#apply').onclick=apply;
  // маска телефона: только +, цифры, пробелы, скобки, дефис
  const telI=$('#f-tel');if(telI)telI.addEventListener('input',()=>{telI.value=telI.value.replace(/[^\d+\s()-]/g,'').replace(/(?!^)\+/g,'');});
  $('#f-email').addEventListener('keydown',e=>{if(e.key==='Enter')apply();});
}
async function apply(){
  const email=$('#f-email').value.trim();
  if(!/.+@.+\..+/.test(email))return toast(al('bad_email'));
  const btn=$('#apply');btn.disabled=true;btn.textContent=al('sending');
  const telV=$('#f-tel').value.trim();
  if(telV&&(telV.replace(/\D/g,'').length<9||telV.replace(/\D/g,'').length>15)){btn.disabled=false;btn.textContent=esc(A.btnText||al('apply'));return toast(al('bad_phone'));}
  const body={name:$('#f-name').value,surname:$('#f-surname').value,email,tel:telV,city:$('#f-city').value,src:new URLSearchParams(location.search).get('src')||''};
  const cf=$('#f-cv').files[0];
  if(cf){ if(cf.size>12*1024*1024){toast(al('too_big'));btn.disabled=false;btn.textContent=esc(A.btnText||al('apply'));return;} body.cvData=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(cf);}); body.cvName=cf.name; }
  try{
    const d=await fetch('/api/a/'+encodeURIComponent(slug)+'/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
    if(d.links&&d.links.length){
      location.href=d.links[0].link;
    } else {
      done(d.msgApply||al('thanks'));
    }
  }catch(e){toast(al('send_err'));btn.disabled=false;btn.textContent=esc(A.btnText||al('apply'));}
}
function done(msg){
  $('#root').innerHTML=`<div class="aq-done">
    <div class="mk"><svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#052015" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-12"/></svg></div>
    <h1>${al('done')}</h1><p>${esc(msg)}</p></div>`;
}
load();
</script>
</body></html>
