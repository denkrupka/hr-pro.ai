const initials = (n, e) => { const s = (n || '').trim(); return (s ? s.split(/\s+/).map(w => w[0]).slice(0, 2).join('') : (e || '?')[0]).toUpperCase(); };
function fmtDur(sec) { if (sec == null) return '—'; const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60, p = n => String(n).padStart(2, '0'); return p(h) + ':' + p(m) + ':' + p(s); }

const DICT = {
  ru: { ai_hint: 'Подсказка от ИИ', z_vlow: 'Очень низкий', z_low: 'Низкий', z_mid: 'Средний', z_high: 'Высокий', z_vhigh: 'Очень высокий', spectrum: 'Спектр профиля', sales_profile: 'Профиль продавца · 12 показателей', interp_h: 'Объяснение результатов', synd_h: 'Синдромы · сочетания и перекосы точек', sales_types_h: 'Тип продажника', syn_hi: 'высокая точка', syn_lo: 'низкая точка', syn_reinf: 'усиливают друг друга', syn_skew: 'перекос: одна выше другой', syn_skew2: 'сильный перекос', syn_comp: 'компульсивная', syn_float: 'плавающая', ans_maybe: 'Ответы «Может быть»', ans_sometimes: 'Ответы «Иногда»', tp_time: 'Время', lr_correct: 'Верных', lr_question: 'Вопрос', lr_answer: 'Ответ:', lr_right: 'Верный:', lr_matrix: 'Абстрактная матрица — оценивается вручную.', mark_visual: 'Визуальный', mark_correct: '✔ Верно', mark_skipped: '— Пропущен', mark_wrong: '✕ Неверно', opt_right: 'верный', opt_chosen: 'выбран', variant: 'Вариант', answers_q: 'Ответы по вопросам', iq_note_h: 'IQ — только часть пазла', iq_note: 'Интеллект показывает способность видеть сходства и различия, разумно мыслить и принимать решения. Особенно важен при выборе руководителя. Не решайте только по IQ — оцените продуктивность «Резалтом» и характер «Тулсом».', pm_years: 'лет', rep_print: 'Сохранить в PDF', public_tag: 'публичный результат', unavailable: 'Результат недоступен' },
  pl: { ai_hint: 'Podpowiedź AI', z_vlow: 'Bardzo niski', z_low: 'Niski', z_mid: 'Średni', z_high: 'Wysoki', z_vhigh: 'Bardzo wysoki', spectrum: 'Spektrum profilu', sales_profile: 'Profil sprzedawcy · 12 wskaźników', interp_h: 'Objaśnienie wyników', synd_h: 'Syndromy · połączenia i przewagi punktów', sales_types_h: 'Typ sprzedawcy', syn_hi: 'wysoki punkt', syn_lo: 'niski punkt', syn_reinf: 'wzmacniają się nawzajem', syn_skew: 'przewaga: jeden wyższy od drugiego', syn_skew2: 'silna przewaga', syn_comp: 'kompulsywny', syn_float: 'pływający', ans_maybe: 'Odpowiedzi „Może”', ans_sometimes: 'Odpowiedzi „Czasami”', tp_time: 'Czas', lr_correct: 'Poprawnych', lr_question: 'Pytanie', lr_answer: 'Odpowiedź:', lr_right: 'Poprawna:', lr_matrix: 'Abstrakcyjna macierz — oceniana ręcznie.', mark_visual: 'Wizualne', mark_correct: '✔ Poprawnie', mark_skipped: '— Pominięte', mark_wrong: '✕ Błędnie', opt_right: 'poprawny', opt_chosen: 'wybrany', variant: 'Wariant', answers_q: 'Odpowiedzi wg pytań', iq_note_h: 'IQ to tylko część układanki', iq_note: 'Inteligencja pokazuje zdolność dostrzegania podobieństw i różnic, rozsądnego myślenia i podejmowania decyzji. Szczególnie ważna przy wyborze kierownika. Nie decyduj wyłącznie na podstawie IQ — oceń produktywność testem „Result” i charakter testem „Tools”.', pm_years: 'lat', rep_print: 'Zapisz PDF', public_tag: 'wynik publiczny', unavailable: 'Wynik niedostępny' },
  en: { ai_hint: 'AI hint', z_vlow: 'Very low', z_low: 'Low', z_mid: 'Medium', z_high: 'High', z_vhigh: 'Very high', spectrum: 'Profile spectrum', sales_profile: 'Salesperson profile · 12 indicators', interp_h: 'Results explanation', synd_h: 'Syndromes · point combinations and skews', sales_types_h: 'Salesperson type', syn_hi: 'high point', syn_lo: 'low point', syn_reinf: 'reinforce each other', syn_skew: 'skew: one above the other', syn_skew2: 'strong skew', syn_comp: 'compulsive', syn_float: 'floating', ans_maybe: '“Maybe” answers', ans_sometimes: '“Sometimes” answers', tp_time: 'Time', lr_correct: 'Correct', lr_question: 'Question', lr_answer: 'Answer:', lr_right: 'Correct:', lr_matrix: 'Abstract matrix — graded manually.', mark_visual: 'Visual', mark_correct: '✔ Correct', mark_skipped: '— Skipped', mark_wrong: '✕ Wrong', opt_right: 'correct', opt_chosen: 'chosen', variant: 'Option', answers_q: 'Answers by question', iq_note_h: 'IQ is only part of the picture', iq_note: 'Intelligence shows the ability to see similarities and differences, reason soundly and make decisions. It matters especially when choosing a manager. Do not decide on IQ alone — assess productivity with “Result” and character with “Tools”.', pm_years: 'y.o.', rep_print: 'Save as PDF', public_tag: 'public result', unavailable: 'Result unavailable' },
};
let LANG = 'ru';
const t = k => (DICT[LANG] || DICT.ru)[k] || DICT.ru[k] || k;

// ── графика спектра (порт из app.js) ──
const OCA_GRP = { A: 'g1', B: 'g1', C: 'g1', D: 'g2', E: 'g3', F: 'g3', G: 'g3', H: 'g4', I: 'g4', J: 'g4' };
const SALES_GRP = { A: 'sg1', B: 'sg1', C: 'sg1', D: 'sg1', E: 'sg2', F: 'sg2', G: 'sg2', H: 'sg2', I: 'sg3', J: 'sg3', K: 'sg3', L: 'sg3' };
const CFG_TOOLS = { width: v => (v + 100) / 2, signed: true, kind: 'tools', grp: OCA_GRP, zbounds: [16, 34, 66, 84], glines: [16, 34, 66, 84], axis: [['−100', 0], ['−68', 16], ['−32', 34], ['+32', 66], ['+68', 84], ['+100', 100]] };
const CFG_SALES = { width: v => v, signed: false, kind: 'sales', grp: SALES_GRP, zbounds: [20, 40, 60, 80], glines: [20, 40, 60, 80], axis: [['0', 0], ['20', 20], ['40', 40], ['60', 60], ['80', 80], ['100', 100]] };
function zoneCols() { return [t('z_vlow'), t('z_low'), t('z_mid'), t('z_high'), t('z_vhigh')]; }
function zoneOf(w, cfg) { const b = cfg.zbounds; return w < b[0] ? 0 : w < b[1] ? 1 : w < b[2] ? 2 : w < b[3] ? 3 : 4; }
function zn(w, cfg) { return 'zn' + zoneOf(w, cfg); }
function zoneHeadRow(cfg) { const b = cfg.zbounds, c = [b[0] / 2, (b[0] + b[1]) / 2, (b[1] + b[2]) / 2, (b[2] + b[3]) / 2, (b[3] + 100) / 2]; return `<div class="oca-row zc"><span></span><span></span><div class="zc-head">${zoneCols().map((z, i) => `<span style="left:${c[i]}%">${z}</span>`).join('')}</div><span></span></div>`; }
function axisRow(cfg) { return `<div class="oca-row axis"><span></span><span></span><div class="oca-axis">${cfg.axis.map(a => `<i style="left:${a[1]}%">${a[0]}</i>`).join('')}</div><span></span></div>`; }
const COMP_TIP = 'Компульсивная точка: показатель «застрял» на максимуме — он выше уверенности (D). Такое качество проявляется навязчиво, человек не может его не проявлять.';
const BOLT_TIP = 'Плавающая точка («молния»): показатель нестабилен и колеблется под влиянием внешних факторов — то поднимается, то падает.';
function barRow(pt, cfg, comp) {
  const w = Math.max(0, Math.min(100, cfg.width(pt.value)));
  const barCls = (cfg.grp[pt.key] || 'g1');
  const num = cfg.signed ? (pt.value > 0 ? '+' + pt.value : '' + pt.value) : '' + pt.value;
  const z = zn(w, cfg);
  const compMark = comp ? `<span class="ptmark comp" data-mtip="${esc(COMP_TIP)}" aria-label="компульсивная">‼</span>` : '';
  const boltMark = pt.manic ? `<span class="ptmark bolt" data-mtip="${esc(BOLT_TIP)}" aria-label="плавающая">${ICON_BOLT}</span>` : '';
  const marks = (compMark || boltMark) ? `<span class="ptmarks">${compMark}${boltMark}</span>` : '';
  const poles = pt.low ? `<i>${esc(pt.low)} — ${esc(pt.high)}</i>` : (pt.desc ? `<i>${esc(pt.desc)}</i>` : '');
  return `<div class="oca-row">
    <div class="oca-name"><b>${pt.key}.</b> <span>${esc(pt.name)}</span>${poles}</div>
    <div class="oca-val ${z}">${marks}<span class="oca-num">${num}</span></div>
    <div class="oca-track" data-tip="${esc(pt.interpretation || pt.label || '')}"><div class="oca-bar ${barCls}" style="width:${w}%"></div>${cfg.glines.map(x => `<i class="gl" style="left:${x}%"></i>`).join('')}</div>
    <div class="oca-zlab ${z}">${esc(pt.label)}</div></div>`;
}
function barChart(order, points, cfg, isComp) { return `<div class="ocachart">${zoneHeadRow(cfg)}${order.map(k => barRow(points[k], cfg, isComp ? isComp(k) : false)).join('')}${axisRow(cfg)}</div>`; }
function chartLegend(cfg, hasComp, hasBolt) {
  const g = (color, label, tip) => `<span data-mtip="${esc(tip)}"><i style="background:${color}"></i>${label}</span>`;
  const groups = cfg.kind === 'tools'
    ? g('#3d6cd1', 'A–C · внутреннее наполнение', 'Внутреннее состояние человека: внимательность, позитивность, самообладание.') +
      g('#1fa8c9', 'D · уверенность', 'Ключевая точка надёжности и уверенности в себе — опора всего профиля.') +
      g('#e8932a', 'E–G · эффективность', 'Как человек действует и добивается результата: активность, настойчивость, ответственность.') +
      g('#1f9d6b', 'H–J · отношения', 'Как человек строит отношения с людьми: объективность, чуткость, общительность.')
    : g('#7b52c9', 'A–D · внутренние качества', 'Организованность, стрессоустойчивость, экспертность, преданность делу.') +
      g('#e0982a', 'E–H · эффективность', 'Деловая хватка, результативность, настойчивость, перфекционизм.') +
      g('#1f9d6b', 'I–L · отношения с клиентами', 'Самоотдача, командная игра, привлечение и удержание клиентов.');
  const comp = hasComp ? `<span class="lg-mark" data-mtip="${esc(COMP_TIP)}"><b class="lg-comp">‼</b>компульсивная точка</span>` : '';
  const bolt = hasBolt ? `<span class="lg-mark" data-mtip="${esc(BOLT_TIP)}"><b class="lg-bolt">${ICON_BOLT}</b>плавающая точка (молния)</span>` : '';
  return `<div class="oca-legend">${groups}${comp}${bolt}</div>`;
}
function zpill(label, value, cfg) { return `<span class="zpill ${zn(Math.max(0, Math.min(100, cfg.width(value))), cfg)}">${esc(label)}</span>`; }
function interpGrid(order, points, cfg) { return `<div class="interp-grid">` + order.map(k => { const pt = points[k]; return `<div class="interp-card"><div class="ic-h"><b>${pt.key}. ${esc(pt.name)}</b>${zpill(pt.label, pt.value, cfg)}</div><p>${esc(pt.interpretation)}</p></div>`; }).join('') + `</div>`; }

// ── синдромы (порт из app.js) ──
function synFormula(f) {
  if (!f) return '';
  const out = [];
  for (let i = 0; i < f.length; i++) {
    const ch = f[i];
    if (/[A-L]/.test(ch)) {
      const m = f[i + 1]; let cls = '', badge = '';
      if (m === '↑') { cls = 'up'; badge = '↑'; i++; }
      else if (m === '↓') { cls = 'down'; badge = '↓'; i++; }
      else if (m === '‼') { cls = 'comp'; badge = '‼'; i++; }
      else if (m === '⚡') { cls = 'float'; badge = '⚡'; i++; }
      out.push(`<span class="syn-pt ${cls}">${ch}${badge ? `<i>${badge}</i>` : ''}</span>`);
    } else if (ch === '+' || ch === '›' || ch === '»') { out.push(`<span class="syn-op">${ch}</span>`); }
  }
  return out.length ? `<div class="syn-f">${out.join('')}</div>` : '';
}
function synLegend(kind) {
  const items = [['up', '↑', t('syn_hi')], ['down', '↓', t('syn_lo')], ['op', '+', t('syn_reinf')]];
  if (kind !== 'sales') items.push(['op', '›', t('syn_skew')], ['op', '»', t('syn_skew2')]);
  items.push(['comp', '‼', t('syn_comp')]);
  if (kind !== 'sales') items.push(['float', '⚡', t('syn_float')]);
  return `<div class="syn-leg">${items.map(([c, s, l]) => `<span><b class="${c}">${s}</b> ${esc(l)}</span>`).join('')}</div>`;
}
function synBlock(list, headKey, kind) {
  if (!list || !list.length) return '';
  const cards = list.map(s => `<div class="synd">${synFormula(s.f)}<b>${esc(s.title)}</b>${esc(s.text)}</div>`).join('');
  return `<h2 style="margin-top:28px">${t(headKey)}</h2>${synLegend(kind)}<div class="synd-grid">${cards}</div>`;
}
function aiBanner(hint, tone) { if (!hint) return ''; const tn = tone || hint.tone || 'good';
  return `<div class="ai-banner ${tn}"><div class="aib-in"><small><span class="ai-spark">${ICON_SPARK}</span>${t('ai_hint')}</small><h3>${esc(hint.verdict)}</h3><ul>${(hint.notes || []).map(n => `<li>${esc(n)}</li>`).join('')}</ul></div></div>`; }

// подсказки при наведении на график
function wireChartTips() {
  let tip = document.getElementById('chart-tip');
  if (!tip) { tip = document.createElement('div'); tip.id = 'chart-tip'; tip.className = 'chart-tip'; document.body.appendChild(tip); }
  const wire = (el, text) => { if (!text) return; el.style.cursor = 'help';
    el.addEventListener('mouseenter', () => { tip.textContent = text; tip.classList.add('show'); });
    el.addEventListener('mousemove', e => { tip.style.left = e.clientX + 'px'; tip.style.top = (e.clientY - 14) + 'px'; });
    el.addEventListener('mouseleave', () => tip.classList.remove('show')); };
  document.querySelectorAll('.oca-track[data-tip]').forEach(tr => wire(tr, tr.dataset.tip));
  document.querySelectorAll('[data-mtip]').forEach(el => wire(el, el.dataset.mtip));
}

  </div>`;

(async () => {
  let d;
  try { const r = await fetch('/api/r/' + id); if (!r.ok) throw 0; d = await r.json(); }
  catch (e) { document.getElementById('root').innerHTML = `<div class="card"><h2>${t('unavailable')}</h2></div>`; return; }
  LANG = d.lang || 'ru';
  document.documentElement.setAttribute('lang', LANG);
  const res = d.result, type = d.test.type;
  let body = '';
  if (type === 'tools') {
    const dVal = res.points.D ? res.points.D.value : -100;
    const isComp = k => k !== 'D' && dVal >= 32 && res.points[k].value > dVal;
    const hasComp = res.order.some(isComp);
    const hasBolt = res.order.some(k => res.points[k].manic);
    const chart = barChart(res.order, res.points, CFG_TOOLS, isComp) + chartLegend(CFG_TOOLS, hasComp, hasBolt);
    const synd = synBlock(res.syndromes, 'synd_h', 'tools');
    const manics = (res.manics || []).map(m => `<div class="callout warn"><div class="co-t">Нестабильность (маник ${m.key})</div>${esc(m.text)}</div>`).join('');
    const interp = `<h2 style="margin-top:28px">${t('interp_h')}</h2>` + interpGrid(res.order, res.points, CFG_TOOLS);
    const meta = `<div class="row" style="gap:14px;margin-top:22px"><div class="tag">${t('ans_maybe')} <b>${res.mAnswers}/200</b></div><div class="tag">${t('tp_time')} <b>${fmtDur(d.test.durationSec)}</b></div></div>`;
    body = aiBanner(d.hint, d.hint && d.hint.tone) + `<h3 class="subh" style="margin:0 0 8px;font-family:Manrope;color:var(--indigo)">${t('spectrum')}</h3>${chart}${meta}${manics}${synd}${interp}`;
  } else if (type === 'sales') {
    const chart = barChart(res.order, res.points, CFG_SALES, null) + chartLegend(CFG_SALES, false);
    const types = synBlock(res.types, 'sales_types_h', 'sales');
    const interp = `<h2 style="margin-top:28px">${t('interp_h')}</h2>` + interpGrid(res.order, res.points, CFG_SALES);
    const meta = `<div class="row" style="gap:14px;margin-top:22px"><div class="tag">${t('ans_sometimes')} <b>${res.midCount}/120</b></div><div class="tag">${t('tp_time')} <b>${fmtDur(d.test.durationSec)}</b></div></div>`;
    body = aiBanner(d.hint, d.hint && d.hint.tone) + `<h3 class="subh" style="margin:0 0 8px;font-family:Manrope;color:var(--indigo)">${t('sales_profile')}</h3>${chart}${meta}${types}${interp}`;
  } else if (type === 'logic') {
    const iq = res.iq != null ? res.iq : res.percent, scaleMin = 60, scaleMax = 160;
    const pos = Math.max(0, Math.min(100, (iq - scaleMin) / (scaleMax - scaleMin) * 100));
    const active = iq < 80 ? 0 : iq < 100 ? 1 : iq < 120 ? 2 : iq < 140 ? 3 : 4;
    const cards = (res.bands || []).map((b, i) => `<div class="q-card" style="${i === active ? 'border:2px solid var(--brand)' : ''}"><b>${esc(b.range)}</b><div class="muted" style="margin-top:6px">${esc(b.text)}</div></div>`).join('');
    const rows = (res.details || []).map(q => {
      const isImg = q.optionImages && q.optionImages.length;
      const givenTxt = q.given != null ? (isImg ? t('variant') + ' ' + (q.given + 1) : q.options[q.given]) : '—';
      const mark = q.unscored ? t('mark_visual') : q.correct ? t('mark_correct') : q.given == null ? t('mark_skipped') : t('mark_wrong');
      const qImg = q.image ? `<div style="text-align:center;margin:8px 0"><img src="${esc(q.image)}" style="max-height:150px;max-width:100%"></div>` : '';
      const optImgs = isImg ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${q.optionImages.map((im, i) => { const isRight = i === q.answer, isGivenWrong = q.given === i && !q.correct; const bc = isRight ? 'var(--good)' : isGivenWrong ? 'var(--bad)' : 'var(--line)'; const tag = isRight ? `<div style="font-size:10px;font-weight:700;color:var(--good)">${t('opt_right')}</div>` : isGivenWrong ? `<div style="font-size:10px;font-weight:700;color:var(--bad)">${t('opt_chosen')}</div>` : `<div class="muted" style="font-size:11px">${i + 1}</div>`; return `<div style="text-align:center"><img src="${esc(im)}" style="height:56px;border:2px solid ${bc};border-radius:8px;padding:2px">${tag}</div>`; }).join('')}</div>` : '';
      return `<div class="q-card"><div class="q-top"><b>${t('lr_question')} ${q.id}</b><span>${mark}</span></div><div>${esc(q.text)}</div>${qImg}${optImgs}${q.unscored ? `<div class="q-ans muted">${t('lr_matrix')}</div>` : `<div class="q-ans">${t('lr_answer')} <b style="color:${q.correct ? 'var(--good)' : 'var(--bad)'}">${esc(givenTxt)}</b>${!q.correct && q.answer != null ? ` · ${t('lr_right')} <b>${esc(q.options[q.answer])}</b>` : ''}</div>`}</div>`;
    }).join('');
    body = aiBanner(d.hint, d.hint && d.hint.tone) +
      `<div class="rep-compact"><div class="iq-block">
        <div class="iq-score" id="iq-score">${iq}</div>
        <div class="iq-scale"><div class="iq-track"><div class="iq-cursor" id="iq-cursor" style="left:${pos}%"></div></div>
          <div class="iq-labels"><span>Min</span><span>${t('z_vlow')}</span><span>${t('z_low')}</span><span>${t('z_mid')}</span><span>${t('z_high')}</span><span>${t('z_vhigh')}</span><span>Max</span></div></div>
        <div class="tag" style="margin-top:12px">${t('lr_correct')} <b>${res.correct}/${res.total}</b></div>
        <div class="q-grid" style="margin-top:16px">${cards}</div>
        <div class="synd" style="margin-top:14px;margin-bottom:0"><b>${t('iq_note_h')}</b>${t('iq_note')}</div></div>
      <h2 style="margin:22px 0 12px">${t('answers_q')}</h2><div class="q-grid">${rows}</div></div>`;
  } else { // result
    const cards = (res.items || []).map(it => `<div class="q-card"><div class="q-top"><b>${t('lr_question')} ${it.id}</b>${it.timeSec != null ? `<span>${fmtDur(it.timeSec)}</span>` : ''}</div><div>${esc(it.text)}</div><div class="q-ans"><b>${t('lr_answer')}</b> ${esc(it.answer) || '<span class="muted">—</span>'}</div>${it.stars ? `<div class="rate-stars" style="margin-top:10px">${[1, 2, 3, 4, 5].map(n => `<span class="${n <= it.stars ? 'on' : ''}">★</span>`).join('')}</div>` : ''}</div>`).join('');
    const meta = `<div class="row" style="gap:14px;margin-top:20px"><div class="tag">${t('tp_time')} <b>${fmtDur(d.test.durationSec)}</b></div></div>`;
    body = aiBanner(d.hint, d.hint && d.hint.tone) + `<div class="q-grid">${cards}</div>${meta}`;
  }
  document.getElementById('root').innerHTML = pubHeader(d) + `<div class="card">${body}</div>`;
  wireChartTips();
})();
</script>
</body></html>
