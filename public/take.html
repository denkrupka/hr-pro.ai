<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR PRO AI</title>
<link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#070a18;color:#eef1fb;font-family:Inter,system-ui,sans-serif}
a{color:#8ba6ff;text-decoration:none}
.tk-shell{position:relative;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column}
.tk-bg1{position:fixed;inset:0;background:radial-gradient(46% 52% at 42% 30%,rgba(93,110,240,.30),transparent 66%),radial-gradient(40% 46% at 88% 82%,rgba(111,151,255,.18),transparent 70%),radial-gradient(38% 44% at 8% 74%,rgba(139,108,255,.16),transparent 70%);animation:glowShift 16s ease-in-out infinite;pointer-events:none;z-index:0}
.tk-bg2{position:fixed;inset:0;background-image:linear-gradient(rgba(120,140,220,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,220,.04) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;z-index:0}
@keyframes glowShift{0%,100%{opacity:.7;transform:translate(-3%,-2%)}50%{opacity:1;transform:translate(3%,3%)}}
@keyframes stepIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes markPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.18)}}
@keyframes doneScale{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
/* top bar */
.tk-top{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:22px clamp(18px,4vw,46px);border-bottom:1px solid rgba(255,255,255,.06)}
.tk-brand{display:flex;align-items:center;gap:13px}
.tk-brand .tk-logo{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:11px;overflow:hidden}
.tk-brand b{font-family:Manrope,sans-serif;font-weight:800;font-size:17px;color:#fff;display:block;line-height:1.15}
.tk-brand small{font-size:12.5px;color:#8b93ad}
.tk-counter{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:#b3a4ff;background:rgba(139,108,255,.12);border:1px solid rgba(139,108,255,.26);padding:8px 15px;border-radius:999px}
.tk-counter.hidden{display:none}
/* body */
.tk-body{position:relative;z-index:5;flex:1;display:flex;flex-direction:column}
.tk-wrap{width:100%;max-width:760px;margin:0 auto;padding:clamp(20px,5vh,60px) clamp(18px,5vw,40px) 90px}
.tk-back{background:none;border:none;color:#8b93ad;font-family:Inter;font-size:14px;font-weight:600;padding:4px 0;margin-bottom:20px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.tk-back:hover{color:#c3cbe4}
.tk-step{animation:stepIn .42s cubic-bezier(.22,.68,.24,1)}
.tk-qhead{display:flex;align-items:flex-start;gap:14px}
.tk-stepno{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;color:#b3a4ff;display:inline-flex;align-items:center;gap:5px;padding-top:6px;flex:none}
.tk-qtitle{font-family:Manrope,sans-serif;font-weight:700;font-size:clamp(24px,4.2vw,34px);line-height:1.25;letter-spacing:-.02em;color:#f4f6ff}
.tk-qnote{font-size:15px;line-height:1.55;color:#9aa3bf;margin-top:11px}
.tk-answers{padding-left:34px;margin-top:30px}
.iln{background:transparent;border:none;border-bottom:2px solid rgba(255,255,255,.28);color:#f4f6ff;font-family:Manrope,sans-serif;font-weight:600;font-size:clamp(22px,4vw,30px);padding:12px 4px;width:100%;max-width:560px;outline:none;transition:border-color .2s}
.iln::placeholder{color:#6b7492;font-weight:500}
.iln:focus{border-bottom-color:#8b6cff}
.iln[readonly]{color:#9aa3bf;border-bottom-style:dashed}
.choices{display:flex;flex-direction:column;gap:12px;max-width:440px}
.optb{text-align:left;padding:15px 20px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#e8ecf8;font-family:Manrope,sans-serif;font-weight:600;font-size:16px;cursor:pointer;transition:.15s;width:100%}
.optb:hover{border-color:rgba(139,108,255,.7);background:rgba(139,108,255,.1)}
.optb.sel{border-color:rgba(139,108,255,.9);background:rgba(139,108,255,.2);color:#fff}
.tk-consent{display:flex;align-items:flex-start;gap:13px;text-align:left;background:none;border:none;padding:0;max-width:560px;cursor:pointer;color:#c3cbe4;font-size:15px;line-height:1.5}
.tk-consent .cbx{width:26px;height:26px;flex:none;border-radius:7px;border:1.6px solid rgba(255,255,255,.28);background:transparent;display:grid;place-items:center;margin-top:1px;transition:.15s}
.tk-consent.on .cbx{border-color:#8b6cff;background:#8b6cff}
.tk-tips{background:rgba(139,108,255,.08);border:1px solid rgba(139,108,255,.2);border-radius:16px;padding:20px 22px;max-width:560px}
.tk-tips h4{font-family:Manrope,sans-serif;font-weight:700;font-size:15px;color:#eef1fb;margin:0 0 14px}
.tk-tip{display:flex;gap:12px;margin-bottom:14px}.tk-tip:last-child{margin-bottom:0}
.tk-tip .n{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:12px;color:#b3a4ff;background:rgba(139,108,255,.16);border:1px solid rgba(139,108,255,.28)}
.tk-tip div{font-size:14px;line-height:1.5;color:#9aa3bf}
.tk-cta{display:inline-flex;align-items:center;gap:10px;border:none;background:linear-gradient(135deg,#8b6cff,#6f97ff);color:#fff;font-family:Manrope,sans-serif;font-weight:800;font-size:16px;padding:15px 30px;border-radius:999px;box-shadow:0 12px 30px rgba(123,108,255,.42);cursor:pointer;transition:transform .15s,filter .2s}
.tk-cta:hover{filter:brightness(1.06)}.tk-cta:active{transform:scale(.98)}
.tk-cta.ghost{background:rgba(255,255,255,.06);box-shadow:none;color:#c3cbe4;font-weight:700}
.tk-enter{margin-left:16px;font-size:13px;color:#6b7492}
.tk-ctarow{margin-top:32px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
/* progress ring (intake) */
.tk-ring{position:fixed;right:clamp(18px,4vw,46px);bottom:34px;z-index:6;width:66px;height:66px}
.tk-ring svg{width:66px;height:66px;transform:rotate(-90deg)}
.tk-ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#fff}
/* test phase */
.tk-test{flex:1;display:flex;flex-direction:column}
.tk-test-back{position:absolute;left:clamp(14px,3vw,40px);top:20px;z-index:6;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);cursor:pointer}
.tk-qcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px clamp(18px,6vw,90px);width:100%;max-width:1000px;margin:0 auto}
.tk-qnum{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:clamp(26px,5vw,38px);background:linear-gradient(120deg,#fff,#b3a4ff 60%,#6f97ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tk-qbig{font-family:Manrope,sans-serif;font-weight:700;font-size:clamp(22px,3.6vw,36px);line-height:1.28;letter-spacing:-.015em;color:#f4f6ff;margin-top:16px}
.tk-scale{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:40px}
.ansb{min-width:150px;padding:16px 28px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#e8ecf8;font-family:Manrope,sans-serif;font-weight:700;font-size:16px;letter-spacing:.03em;cursor:pointer;transition:.15s}
.ansb:hover{border-color:rgba(139,108,255,.6);background:rgba(139,108,255,.12);color:#fff}
.ansb.sel{border-color:rgba(139,108,255,.9);background:rgba(139,108,255,.22);color:#fff}
.ansb-key{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-right:9px;border-radius:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:12.5px;font-weight:800;color:#c3cbe4;vertical-align:middle}
.ansb:hover .ansb-key,.ansb.sel .ansb-key{background:rgba(255,255,255,.2);color:#fff}
.tk-kbd-hint{margin-top:20px;text-align:center;font-size:12.5px;color:rgba(195,203,228,.6);letter-spacing:.02em}
.tk-kbd-note{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:13px;color:#c3cbe4;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 16px;max-width:560px}
.tk-kbd-keys{display:inline-flex;gap:5px;flex:none}
.tk-kbd-keys b{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:rgba(139,108,255,.15);border:1px solid rgba(139,108,255,.35);font-size:12.5px;font-weight:800;color:#b3a4ff}
.tk-optlist{display:flex;flex-direction:column;gap:12px;width:100%;max-width:620px;margin:34px auto 0;text-align:left}
.tk-imggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:620px;margin:30px auto 0}
.tk-imgopt{display:flex;align-items:center;justify-content:center;min-height:120px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);cursor:pointer;padding:10px;transition:.15s}
.tk-imgopt:hover{border-color:rgba(139,108,255,.6)}.tk-imgopt.sel{border-color:rgba(139,108,255,.9);background:rgba(139,108,255,.16)}
.tk-imgopt img{max-height:100px;max-width:100%}
.tk-media{margin:0 auto 20px;max-width:620px}.tk-media img,.tk-media video{max-width:100%;max-height:260px;border-radius:12px}
.tk-ta{width:100%;max-width:620px;margin:24px auto 0;display:block;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);border-radius:14px;color:#f4f6ff;font-family:Inter;font-size:16px;padding:15px 17px;min-height:150px;outline:none}
.tk-ta:focus{border-color:rgba(139,108,255,.7)}
.rc-list{display:flex;flex-direction:column;gap:14px;width:100%;max-width:680px;margin:24px auto 0;text-align:left}
.rc-row{display:grid;grid-template-columns:auto repeat(5,1fr);gap:8px;align-items:center}
.rc-n{font-family:'JetBrains Mono',monospace;color:#8b93ad;font-size:13px}
.rc-in{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);border-radius:10px;color:#f4f6ff;font-family:Inter;font-size:13.5px;padding:11px 12px;outline:none;min-width:0}
.rc-in:focus{border-color:rgba(139,108,255,.7)}
.tk-navrow{display:flex;justify-content:center;gap:12px;margin-top:26px}
.tk-multi-hint{color:#9aa3bf;font-size:13px;margin-top:12px;text-align:center}
/* progress bar (test) */
.tk-progress{flex:none;padding:0 clamp(20px,10vw,120px) 40px}
.tk-progress .plabel{text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.28em;color:#7b83a0;margin-bottom:11px}
.tk-bar{position:relative;height:9px;border-radius:6px;background:rgba(255,255,255,.07)}
.tk-bar>i{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:linear-gradient(90deg,#9be7f2,#6f97ff 60%,#5b6ef0);box-shadow:0 0 18px rgba(111,151,255,.55);transition:width .34s cubic-bezier(.22,.68,.24,1)}
.tk-bar>.mk{position:absolute;top:-7px;transition:left .34s cubic-bezier(.22,.68,.24,1)}
.tk-bar>.mk i{display:block;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #6f97ff;transform:translateX(-50%);animation:markPulse 1.8s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(111,151,255,.8))}
/* cv drop */
.cv-drop{display:flex;align-items:center;gap:12px;max-width:560px;padding:18px 20px;border:1.6px dashed rgba(255,255,255,.22);border-radius:14px;color:#9aa3bf;cursor:pointer;transition:.15s}
.cv-drop:hover,.cv-drop.over{border-color:rgba(139,108,255,.7);color:#c3cbe4;background:rgba(139,108,255,.06)}
.cv-drop svg{width:26px;height:26px;flex:none;color:#b3a4ff}
/* done + card */
.tk-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.tk-done .mark{width:108px;height:108px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(135deg,#8b6cff,#6f97ff);box-shadow:0 24px 60px rgba(123,108,255,.45);animation:doneScale .5s cubic-bezier(.2,.8,.3,1)}
.tk-done h1{font-family:Manrope,sans-serif;font-weight:800;font-size:clamp(26px,5vw,34px);letter-spacing:-.02em;color:#fff;margin:28px 0 0}
.tk-done p{font-size:16px;line-height:1.6;color:#9aa3bf;margin:14px 0 0;max-width:460px}
.tk-card{max-width:520px;margin:60px auto;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:34px;text-align:center}
.tk-card h2{font-family:Manrope,sans-serif;color:#fff;margin:0 0 8px}
.muted{color:#8b93ad}
.timer-pill{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:#9be7f2;background:rgba(90,110,240,.14);border:1px solid rgba(111,151,255,.3);padding:8px 14px;border-radius:999px}
.timer-pill.hidden{display:none}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#12142e;border:1px solid rgba(255,255,255,.14);color:#f4f6ff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:1300;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* conversational question (sales/result/logis/znania) — left-aligned, radio-dot choices */
.tk-conv{width:100%;max-width:760px;margin:0 auto;padding:24px clamp(18px,5vw,40px) 96px;flex:1;box-sizing:border-box}
.tk-qtext{font-family:Manrope,sans-serif;font-weight:700;font-size:clamp(19px,2.8vw,23px);line-height:1.4;letter-spacing:-.01em;color:#f4f6ff}
.optc{display:flex;align-items:center;gap:12px;text-align:left;padding:15px 18px;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:#c3cbe4;font-family:Inter,sans-serif;font-weight:600;font-size:15.5px;cursor:pointer;transition:.15s;width:100%}
.optc:hover{border-color:rgba(139,108,255,.55);background:rgba(139,108,255,.08)}
.optc.sel{border-color:rgba(139,108,255,.6);background:rgba(139,108,255,.16);color:#fff}
.optc .dot{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center}
.optc.sel .dot{border-color:#8b6cff}
.optc.sel .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#8b6cff}
.optc.multi .dot{border-radius:5px}
.ata{width:100%;max-width:620px;box-sizing:border-box;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:14px;color:#f4f6ff;font-family:Inter;font-size:16px;line-height:1.55;padding:15px 17px;outline:none;resize:none;transition:.2s}
.ata:focus{border-color:rgba(139,108,255,.7);box-shadow:0 0 0 3px rgba(123,108,255,.14)}
.rc-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 16px}
.rc-card .rc-h{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b93ad;font-weight:700;margin-bottom:10px}
.rc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rc-grid .ata{font-size:14px;padding:11px 13px;max-width:none}
.conv-imggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:560px}
/* intro screen */
.tk-intro-wrap{flex:1;display:flex;align-items:center}
.tk-intro{width:100%;max-width:720px;margin:0 auto;padding:24px clamp(18px,5vw,40px) 40px}
.tk-intro .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#b3a4ff;font-weight:700;display:flex;align-items:center;gap:8px}
.tk-intro .eyebrow span{width:20px;height:3px;border-radius:2px;background:linear-gradient(90deg,#8b6cff,#6f97ff)}
.tk-intro h1{font-family:Manrope,sans-serif;font-weight:800;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;color:#fff;margin:16px 0 0;line-height:1.15}
.tk-intro p{font-size:17px;line-height:1.65;color:#9aa3bf;margin:18px 0 0;max-width:600px}
.tk-chip{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:#c3cbe4;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);padding:11px 16px;border-radius:12px;margin-top:28px}
.tk-chip svg{width:18px;height:18px;stroke:#b3a4ff}
@media(max-width:640px){.tk-answers{padding-left:0}.tk-qhead{gap:10px}.tk-stepno{font-size:16px}.rc-row{grid-template-columns:1fr 1fr;gap:7px}.rc-n{grid-column:1/-1}.rc-grid{grid-template-columns:1fr}.tk-ring{width:54px;height:54px;bottom:20px}.tk-ring svg{width:54px;height:54px}.tk-scale .ansb{min-width:0;flex:1}}
</style>
</head><body>
<div class="tk-bg1"></div><div class="tk-bg2"></div>
<div class="tk-shell" id="shell">
  <div class="tk-top">
    <div class="tk-brand">
      <span class="tk-logo" id="t-logo"><svg viewBox="0 0 64 64" fill="none" style="width:42px;height:42px"><path d="M32 4 56 18 56 46 32 60 8 46 8 18Z" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" opacity=".9"/><line x1="33" y1="31" x2="22" y2="25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="33" y1="31" x2="41" y2="21" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="33" y1="31" x2="46" y2="35" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="33" y1="31" x2="29" y2="45" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="22" cy="25" r="3.4" stroke="#fff" stroke-width="2"/><circle cx="41" cy="21" r="3.6" stroke="#fff" stroke-width="2"/><circle cx="46" cy="35" r="3.2" stroke="#fff" stroke-width="2"/><circle cx="29" cy="45" r="3" stroke="#fff" stroke-width="2"/><circle cx="33" cy="31" r="4.2" fill="#FF7A5C"/></svg></span>
      <div><b id="t-title">HR PRO AI</b><small id="t-sub">Тестирование</small></div>
    </div>
    <div class="tk-counter hidden" id="counter"></div>
    <div class="timer-pill hidden" id="timer">--:--</div>
  </div>
  <div class="tk-body" id="root"><p class="muted" style="padding:40px">Загрузка…</p></div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);};
const CHECK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>';
const ARROW='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';

let integrity={tabSwitches:0,tabByQ:{},copyCount:0,copied:[],pasteCount:0,focusLostMs:0};
let testActive=false,_hiddenAt=0;
function curQid(){try{return (T&&T.questions&&T.questions[idx])?T.questions[idx].id:null;}catch(_){return null;}}
(function initIntegrity(){
  document.addEventListener('visibilitychange',()=>{
    if(!testActive)return;
    if(document.hidden){integrity.tabSwitches++;_hiddenAt=Date.now();const qid=curQid();if(qid!=null)integrity.tabByQ[qid]=(integrity.tabByQ[qid]||0)+1;}
    else if(_hiddenAt){integrity.focusLostMs+=Date.now()-_hiddenAt;_hiddenAt=0;}
  });
  window.addEventListener('blur',()=>{if(testActive&&!document.hidden)_hiddenAt=_hiddenAt||Date.now();});
  window.addEventListener('focus',()=>{if(testActive&&_hiddenAt){integrity.focusLostMs+=Date.now()-_hiddenAt;_hiddenAt=0;}});
  document.addEventListener('copy',()=>{
    if(!testActive)return;integrity.copyCount++;
    try{const s=String(window.getSelection()||'').trim().replace(/\s+/g,' ').slice(0,200);if(s&&integrity.copied.length<25&&integrity.copied.indexOf(s)<0)integrity.copied.push(s);}catch(_){}
  });
  document.addEventListener('paste',()=>{if(testActive)integrity.pasteCount++;});
  // «Тулс»: выбор ответа клавишами 1=Да, 2=Может быть, 3=Нет
  document.addEventListener('keydown',e=>{
    if(!testActive||!T||T.type!=='tools'||!$('.tk-scale'))return;

    if(map[e.key]){e.preventDefault();pickTools(map[e.key]);}
  });
})();
let _picking=false;
function pickTools(v){
  if(_picking||!T||T.type!=='tools')return;const q=T.questions[idx];if(!q)return;
  _picking=true;answers[q.id]=v;

}

function buildSteps(){
  const p=T.participant||{};const has=v=>!!String(v==null?'':v).trim();
  const defs=[
    {key:'name',title:tl('q_name'),ph:tl('name')},
    {key:'surname',title:tl('q_surname'),ph:tl('surname')},
    {key:'sex',type:'choice',title:tl('q_sex'),note:tl('q_sex_note'),opts:[[tl('male'),'Мужской'],[tl('female'),'Женский']]},
    {key:'age',title:tl('q_age'),ph:tl('age'),numeric:true},
    {key:'tel',title:tl('q_tel'),note:tl('q_tel_note'),ph:tl('phone'),lock:!!T.lockTel},
    {key:'city',title:tl('q_city'),ph:tl('city')},
    {key:'email',title:tl('q_email'),note:tl('q_email_note'),ph:tl('email'),lock:!!T.lockEmail},
  ];
  steps=defs.filter(d=>!has(p[d.key]));

  sIdx=0;
}

    ans=`<input class="iln" id="fld" value="${esc(intake[st.key]||'')}" placeholder="${esc(st.ph||'')}" ${st.lock?'readonly':''} ${st.numeric?'inputmode="numeric" maxlength="2"':''}>`;
  }
  const showEnter=(!st.type)&&' ';
  $('#counter').classList.add('hidden');$('#timer').classList.add('hidden');
  $('#root').innerHTML=`<div class="tk-wrap"><div class="tk-step">
    ${sIdx>0?`<button class="tk-back" id="s-back"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>${tl('back')}</button>`:''}
    <div class="tk-qhead"><span class="tk-stepno">${sIdx+1}<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#b3a4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
      <div style="min-width:0;flex:1"><div class="tk-qtitle">${esc(st.title)}</div>${st.note?`<div class="tk-qnote">${esc(st.note)}</div>`:''}</div></div>
    <div class="tk-answers">${ans}
      <div class="tk-ctarow"><button class="tk-cta" id="s-next">${esc(st.cta||tl('next'))}${ARROW}</button>${showEnter?`<span class="tk-enter">${tl('enter_hint')}</span>`:''}</div>
    </div></div></div>
    <div class="tk-ring"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/><circle cx="22" cy="22" r="19" fill="none" stroke="url(#pg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="${119.4*(1-pct/100)}"/><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#6f97ff"/></linearGradient></defs></svg><div class="lbl">${pct}%</div></div>`;
  const back=$('#s-back');if(back)back.onclick=()=>{if(sIdx>0){sIdx--;renderStep();}};
  $('#s-next').onclick=stepNext;
  const fld=$('#fld');if(fld){fld.focus();if(st.numeric)fld.addEventListener('input',()=>fld.value=fld.value.replace(/\D/g,'').slice(0,2));if(st.key==='tel'&&!st.lock)fld.addEventListener('input',()=>fld.value=fld.value.replace(/[^\d+\s()-]/g,'').replace(/(?!^)\+/g,''));fld.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();stepNext();}});}
  $$('[data-pick]').forEach(b=>b.onclick=()=>{intake[st.key]=b.dataset.pick;$$('[data-pick]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');setTimeout(stepNext,140);});
  const cb=$('#consent-btn');if(cb)cb.onclick=()=>{consentOn=!consentOn;renderStep();};
  const cvI=$('#p-cv');if(cvI){cvI.onchange=async()=>{const f=cvI.files[0];if(!f)return;if(f.size>12*1024*1024){toast(tl('cv_big'));cvI.value='';return;}$('#cv-drop-txt').textContent=f.name;const rd=new FileReader();rd.onload=()=>pendingCv={cvData:rd.result,cvName:f.name};rd.readAsDataURL(f);};
    const drop=$('#cv-drop');['dragover','dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.toggle('over',ev==='dragover');if(ev==='drop'&&e.dataTransfer.files[0]){cvI.files=e.dataTransfer.files;cvI.onchange();}}));}
}
function stepNext(){
  const st=steps[sIdx];
  if(!st.type){const v=($('#fld')?$('#fld').value:'').trim();
    if(!st.lock&&!v)return toast(tl('req_fields'));
    if(st.key==='age'&&(!/^\d{2}$/.test(v)||+v<16||+v>79))return toast(tl('bad_age'));
    if(st.key==='tel'){const d=v.replace(/\D/g,'');if(d.length<9||d.length>15)return toast(tl('bad_phone'));}
    if(st.key==='email'&&!/.+@.+\..+/.test(v))return toast(tl('bad_email'));
    intake[st.key]=v||String((T.participant||{})[st.key]||'');
  }
  if(st.type==='choice'&&!intake[st.key])return toast(tl('req_fields'));
  if(st.type==='consent'&&!consentOn)return toast(tl('need_consent'));
  if(sIdx<steps.length-1){sIdx++;renderStep();}else renderIntro();
}
async function commitIntake(){
  const p=T.participant||{};const g=k=>String(intake[k]!=null&&String(intake[k]).trim()?intake[k]:(p[k]||'')).trim();
  const body={name:g('name'),surname:g('surname'),sex:g('sex'),age:g('age'),tel:g('tel'),city:g('city'),email:g('email')};
  if(pendingCv)Object.assign(body,pendingCv);
  await fetch('/api/take/'+code+'/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  startTs=Date.now();idx=0;qStart=Date.now();testActive=true;
  if(T.timeLimitSec)startTimer();
  renderQuestion();
}
function startTimer(){
  $('#timer').classList.remove('hidden');const end=Date.now()+T.timeLimitSec*1000;
  timerInt=setInterval(()=>{const left=Math.max(0,Math.round((end-Date.now())/1000));const el=$('#timer');if(el){const m=Math.floor(left/60),s=left%60;el.textContent=`${m}:${String(s).padStart(2,'0')}`;}if(left<=0){clearInterval(timerInt);submit();}},500);
}
// ── ТЕСТ ── Tools — центрированный авто-переход; остальные — конверсационный слева.
function renderQuestion(){ return T.type==='tools' ? renderCentered() : renderConversational(); }
// Tools: большой вопрос по центру, 3 кнопки, авто-переход, полоса прогресса снизу.
function renderCentered(){
  const qs=T.questions,q=qs[idx];qStart=Date.now();
  $('#counter').classList.remove('hidden');$('#counter').textContent=(idx+1)+' / '+qs.length;
  const cur=answers[q.id];
  const ans=`<div class="tk-scale">`+[['+','yes','1'],['M','maybe','2'],['-','no','3']].map(o=>`<button class="ansb ${cur===o[0]?'sel':''}" data-v="${o[0]}"><span class="ansb-key">${o[2]}</span>${tl(o[1])}</button>`).join('')+`</div><div class="tk-kbd-hint">${tl('kbd_hint')}</div>`;
  const progW=(idx/qs.length*100);
  $('#root').innerHTML=`<div class="tk-test">
    <button class="tk-test-back" id="q-back" title="${tl('back')}"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#c3cbe4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="tk-qcenter"><div class="tk-qnum">${idx+1}.</div><div class="tk-qbig">${esc(q.text)}</div>${ans}</div>
    <div class="tk-progress"><div class="plabel">${tl('progress_w')}</div><div class="tk-bar"><i style="width:${progW}%"></i><div class="mk" style="left:${progW}%"><i></i></div></div></div></div>`;
  $('#q-back').onclick=()=>{recordTime(q);if(idx>0){idx--;renderQuestion();}else renderIntro();};
  $$('.tk-scale .ansb').forEach(b=>b.onclick=()=>pickTools(b.dataset.v));
}
// Sales/Result/Logis/Znania: слева, номер шага, вопрос, варианты с точкой-радио / текст / контакты, кнопка «Далее», кольцо.
function renderConversational(){
  const qs=T.questions,q=qs[idx];qStart=Date.now();
  $('#counter').classList.remove('hidden');$('#counter').textContent=(idx+1)+' / '+qs.length;
  const pct=Math.round(idx/Math.max(1,qs.length-1)*100);
  let ans='',autoSingle=false;
  if(T.type==='sales'){const so=T.scaleOptions||[tl('yes'),tl('maybe'),tl('no')];
    ans=`<div class="choices">`+so.map((o,i)=>`<button class="optc ${answers[q.id]==i?'sel':''}" data-v="${i}"><span class="dot"></span>${esc(o)}</button>`).join('')+`</div>`;autoSingle=true;
  }else if(T.type==='logic'){
    const media=q.image?`<div class="tk-media"><img src="${esc(q.image)}"></div>`:'';
    if(q.optionImages&&q.optionImages.length){ans=media+`<div class="conv-imggrid">`+q.optionImages.map((im,i)=>`<button class="tk-imgopt ${answers[q.id]==i?'sel':''}" data-v="${i}"><img src="${esc(im)}"></button>`).join('')+`</div>`;}
    else{ans=media+`<div class="choices">`+q.options.map((o,i)=>`<button class="optc ${answers[q.id]==i?'sel':''}" data-v="${i}"><span class="dot"></span>${esc(o)}</button>`).join('')+`</div>`;}
    autoSingle=true;
  }else if(T.type==='knowledge'){
    const media=(q.image?`<div class="tk-media"><img src="${esc(q.image)}"></div>`:'')+(q.video?`<div class="tk-media"><video src="${esc(q.video)}" controls></video></div>`:'');
    const sel=answers[q.id];const isSel=i=>q.type==='multi'?(Array.isArray(sel)&&sel.includes(i)):(sel==i);
    ans=media+`<div class="choices">`+q.options.map((o,i)=>`<button class="optc ${q.type==='multi'?'multi ':''}${isSel(i)?'sel':''}" data-v="${i}"><span class="dot"></span>${esc(o)}</button>`).join('')+`</div>`+(q.type==='multi'?`<p class="tk-multi-hint" style="text-align:left">${tl('multi_hint')}</p>`:'');
    autoSingle=(q.type!=='multi');
  }else{ // result
    if(q.type==='contacts'){
      const cur=Array.isArray(answers[q.id])&&answers[q.id].length?answers[q.id]:[{},{},{}];
      ans=cur.map((c,i)=>`<div class="rc-card"><div class="rc-h">${tl('company')} · #${i+1}</div><div class="rc-grid">
        <input class="ata" data-rc="${i}-name" placeholder="${tl('name')}" value="${esc(c.name||'')}">
        <input class="ata" data-rc="${i}-surname" placeholder="${tl('surname')}" value="${esc(c.surname||'')}">
        <input class="ata" data-rc="${i}-position" placeholder="${tl('position_l')}" value="${esc(c.position||'')}">
        <input class="ata" data-rc="${i}-company" placeholder="${tl('company')}" value="${esc(c.company||'')}">
        <input class="ata" data-rc="${i}-phone" inputmode="tel" placeholder="${tl('phone')}" value="${esc(c.phone||'')}"></div></div>`).join('');
      ans=`<div style="display:flex;flex-direction:column;gap:14px">${ans}</div>`+(cur.length<5?`<button class="tk-cta ghost" id="rc-add" style="margin-top:12px">+ ${tl('ref_add')}</button>`:'');
    }else if(q.type==='choice'||q.type==='choice_explain'){
      ans=`<div class="choices">`+q.options.map(o=>`<button class="optc ${answers[q.id]===o?'sel':''}" data-v="${esc(o)}"><span class="dot"></span>${esc(o)}</button>`).join('')+`</div>`+(q.type==='choice_explain'?`<textarea class="ata" id="explain" placeholder="${tl('explain_ph')} *" style="margin-top:12px">${esc(answers['e'+q.id]||'')}</textarea>`:'');
    }else{ans=`<textarea class="ata" id="text-ans" placeholder="${tl('answer_ph')}" style="min-height:150px">${esc(answers[q.id]||'')}</textarea>`;}
  }
  const isLast=idx===qs.length-1;
  $('#root').innerHTML=`<div class="tk-conv">
    <button class="tk-back" id="prev"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>${tl('back')}</button>
    <div class="tk-qhead"><span class="tk-stepno">${idx+1}<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#b3a4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span><div style="min-width:0;flex:1"><div class="tk-qtext">${esc(q.text)}</div></div></div>
    <div class="tk-answers">${ans}<div class="tk-ctarow"><button class="tk-cta" id="next">${isLast?tl('finish'):tl('next')}${ARROW}</button></div></div></div>
    <div class="tk-ring"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/><circle cx="22" cy="22" r="19" fill="none" stroke="url(#pg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="${119.4*(1-pct/100)}"/><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#6f97ff"/></linearGradient></defs></svg><div class="lbl">${pct}%</div></div>`;
  $('#prev').onclick=()=>{if(q.type==='contacts')answers[q.id]=collectContacts();recordTime(q);if(idx>0){idx--;renderQuestion();}else renderIntro();};
  $$('.optc,.tk-imgopt').forEach(b=>{if(b.dataset.v===undefined)return;b.onclick=()=>{
    if(T.type==='knowledge'&&q.type==='multi'){let arr=Array.isArray(answers[q.id])?answers[q.id]:[];const iv=parseInt(b.dataset.v,10);if(arr.includes(iv))arr=arr.filter(x=>x!==iv);else arr=arr.concat(iv);answers[q.id]=arr;b.classList.toggle('sel');return;}
    if(T.type==='logic'||T.type==='sales'||T.type==='knowledge')answers[q.id]=parseInt(b.dataset.v,10);else answers[q.id]=b.dataset.v;
    $$('.optc,.tk-imgopt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
    if(autoSingle){recordTime(q);setTimeout(nextQ,180);}
  };});
  const rcAdd=$('#rc-add');if(rcAdd)rcAdd.onclick=()=>{const cs=collectContacts();if(cs.length>=5)return toast(tl('ref_max'));answers[q.id]=cs.concat([{}]);recordTime(q);renderQuestion();};
  $('#next').onclick=()=>{
    if(q.type==='contacts'){answers[q.id]=collectContacts();if(!answers[q.id].some(c=>c.phone&&c.phone.trim())){confirmSkipContacts(()=>{recordTime(q);nextQ();});return;}}
    if(T.type==='result'){const ta=$('#text-ans');if(ta)answers[q.id]=ta.value;const ex=$('#explain');if(ex){answers['e'+q.id]=ex.value;if(answers[q.id]&&!ex.value.trim())return toast(tl('need_explain'));}}
    recordTime(q);nextQ();};
}
function recordTime(q){times[q.id]=(times[q.id]||0)+Math.round((Date.now()-qStart)/1000);qStart=Date.now();}
function collectContacts(){
  const map={};
  $$('[data-rc]').forEach(el=>{const p=el.dataset.rc.split('-');(map[p[0]]=map[p[0]]||{})[p[1]]=el.value.trim();});
  return Object.keys(map).sort((a,b)=>a-b).map(k=>map[k]).filter(c=>c.name||c.surname||c.position||c.company||c.phone);
}
function confirmSkipContacts(onSkip){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(4,6,15,.72);backdrop-filter:blur(3px);z-index:1200;display:flex;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML=`<div style="background:#0d1024;border:1px solid rgba(255,255,255,.1);border-radius:18px;max-width:440px;width:100%;padding:26px;box-shadow:0 30px 90px rgba(0,0,0,.6);color:#c3cbe4">
    <h3 style="font-family:Manrope,sans-serif;margin:0 0 10px;color:#fff;font-size:19px">${tl('ref_skip_title')}</h3>
    <p style="font-size:14px;line-height:1.6;margin:0 0 22px">${tl('ref_skip_body')}</p>
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button class="tk-cta ghost" id="rc-skip">${tl('ref_skip_yes')}</button>
      <button class="tk-cta" id="rc-fill">${tl('ref_skip_fill')}</button></div></div>`;
  document.body.appendChild(ov);const close=()=>ov.remove();
  ov.querySelector('#rc-fill').onclick=close;ov.querySelector('#rc-skip').onclick=()=>{close();onSkip();};
  ov.addEventListener('click',e=>{if(e.target===ov)close();});
}
function nextQ(){if(idx<T.questions.length-1){idx++;renderQuestion();}else submit();}
async function submit(){
  testActive=false;
  if(timerInt)clearInterval(timerInt);$('#timer').classList.add('hidden');$('#counter').classList.add('hidden');
  if(T.type==='result'){T.questions.forEach(q=>{if(q.type==='choice_explain'&&answers['e'+q.id])answers[q.id]=(answers[q.id]||'')+' — '+answers['e'+q.id];});}
  $('#root').innerHTML=`<div class="tk-card"><p class="muted">${tl('sending')}</p></div>`;
  await fetch('/api/take/'+code+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers,times,integrity})});
  const nm=(intake.name||(T.participant&&T.participant.name)||'').trim();
  $('#root').innerHTML=`<div class="tk-done"><div class="mark"><svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-12"/></svg></div>
    <h1>${tl('test_done_h')}</h1><p>${tl('thanks_test')} «${esc(T.title)}».<br>${tl('sent_recruiter')}</p></div>`;
}
load();
</script>
</body></html>
